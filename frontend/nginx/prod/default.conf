# GZIP settings for this specific configuration file
gzip on;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/vnd.ms-fontobject
    font/opentype
    application/x-font-opentype
    application/x-font-truetype
    application/x-font-ttf
    application/font-woff
    application/font-woff2
    application/x-font-woff
    application/octet-stream;
gzip_vary on;
gzip_proxied any;
gzip_disable "msie6";

server {
    listen 80 default_server;
    server_name battle.v-petrenko.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;

    ssl_certificate /etc/nginx/ssl/site0.cert;
    ssl_certificate_key /etc/nginx/ssl/site0.key;

    server_name battle.v-petrenko.ru;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;

        # Дополняем заголовки CORS
        add_header 'Access-Control-Allow-Origin' 'battle.v-petrenko.ru' always;
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
    }

    location /api {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Специальная обработка пути "/adminer"
    location /adminer {
        rewrite ^/adminer/(.*)$ /$1 break;
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}